name: Docker CI Pipeline
run-name: ${{ github.actor }} is running on Docker CI Pipeline
on : [push]
jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run hadolint for dockrfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL4000

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'https://ginandjuice.shop/'

      - name: Docker Build
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/helloworld-python:v1 .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/helloworld-python:v1'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
         username: ${{ vars.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Push
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/helloworld-python:v1 

      - name: Run the container
        run: docker run --name helloworld-python -idt -p 8080:8080 ${{ vars.DOCKERHUB_USERNAME }}/helloworld-python:v1 

      - name: View the container
        run: docker ps
    
  K8s-implementation:
        needs: docker-build-push
        runs-on: ubuntu-latest
        steps:
        - name: Clone the code
          uses: actions/checkout@v6 
       
        - name: start minikube
          uses: medyagh/setup-minikube@latest
          
        - name: kubectl
          run: kubectl get pods -A
          
        - name: Deploy to minikube
          run: |
            kubectl apply -f manifests/deployment.yaml
            kubectl apply -f manifests/service.yaml
            kubectl wait --for=condition=ready pod -l app=hello-world-python
          
        - name: check deployments and service
          run: | 
           kubectl get deployments
           kubectl get service
         
        - name: check service URLs
          run: |
           minikube service list
           minikube service my-service --url
           echo "-----opening the service-----"
           curl $(minikube service my-service --url)
